<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keuangan The Hive</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F7;--card:#fff;--ink:#16222E;--mut:#5E6C7A;--line:#DDE4EA;--in:#0E7C86;--out:#B0435A;--cap:#6B7A8C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181F;--card:#17222B;--ink:#E6EDF3;--mut:#9AA8B6;--line:#273541;--in:#3BB6C0;--out:#E0788D;--cap:#8C9AAB}}
:root[data-theme="dark"]{--bg:#10181F;--card:#17222B;--ink:#E6EDF3;--mut:#9AA8B6;--line:#273541;--in:#3BB6C0;--out:#E0788D;--cap:#8C9AAB}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 'IBM Plex Sans',system-ui,sans-serif}
main{max-width:1040px;margin:0 auto;padding:24px 16px 40px}
h1{font:500 28px/1.2 'IBM Plex Serif',Georgia,serif;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 20px}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.bar label,.lbl{color:var(--mut);font-size:13px}
select,input[type=file]{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
select:focus-visible,input:focus-visible{outline:2px solid var(--in);outline-offset:2px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
.hero .big{font:500 38px/1.1 'IBM Plex Serif',Georgia,serif;margin:2px 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.k{border-left:3px solid var(--line);padding:4px 0 4px 12px}
.k b{display:block;font-size:20px;font-weight:600}
.k.in{border-color:var(--in)}.k.out{border-color:var(--out)}.k.cap{border-color:var(--cap)}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media(max-width:780px){.grid{grid-template-columns:1fr}.hero .big{font-size:30px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{font-size:15px;font-weight:600;margin:0 0 10px}
.cv{position:relative;height:260px}.cv.s{height:170px}
.note{color:var(--mut);font-size:12.5px;margin-top:20px;max-width:75ch}.note p{margin:0 0 6px}
#err{background:var(--card);border:1px solid var(--out);border-radius:8px;padding:12px;margin-bottom:16px}
</style></head><body><main>
<h1>Keuangan The Hive</h1>
<p class="sub" id="sub">Memuat data…</p>
<div id="err" role="alert" hidden></div>
<div class="bar"><label for="f">Dari</label><select id="f"></select><label for="t">Sampai</label><select id="t"></select>
<label for="file">Coba CSV lain</label><input id="file" type="file" accept=".csv,text/csv"></div>
<section class="hero"><div class="lbl">Saldo kas di akhir periode (menurut sheet)</div><div class="big" id="bal">-</div><div class="cv s"><canvas id="c1"></canvas></div></section>
<section class="kpis">
<div class="k in"><span class="lbl">Pendapatan Airbnb</span><b id="k1">-</b></div>
<div class="k out"><span class="lbl">Total pengeluaran</span><b id="k2">-</b></div>
<div class="k"><span class="lbl">Hasil operasional</span><b id="k3">-</b><span class="lbl" id="k3s"></span></div>
<div class="k cap"><span class="lbl">Modal masuk</span><b id="k4">-</b></div>
</section>
<div class="grid"><section class="card"><h2>Pendapatan dan pengeluaran per bulan</h2><div class="cv"><canvas id="c2"></canvas></div></section>
<section class="card"><h2>Pengeluaran per kategori</h2><div class="cv"><canvas id="c3"></canvas></div></section></div>
<div class="note" id="note"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
/*PURE*/
const KNOWN_ADJ=[['2026-03-01',2668394]];
const LAB={'Inventory Purchase':'Perlengkapan','Laundry bills':'Laundry','Others':'Lain-lain','opc - Electricity Bill':'Listrik','opc - Home Service':'Home service','opc - Internet Bill':'Internet','opc - Repair & Maintenance':'Perbaikan','opc - Transportation':'Transportasi'};
function parseCSV(t){const r=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);f='';if(row.some(x=>x!==''))r.push(row);row=[]}else f+=c}if(f!==''||row.length){row.push(f);if(row.some(x=>x!==''))r.push(row)}return r}
const num=s=>{s=(s||'').replace(/[^\d.\-()]/g,'');if(!s)return 0;const n=parseFloat(s.replace(/[()]/g,''));return isNaN(n)?0:(s.includes('(')?-n:n)};
function analyze(text){
const R=parseCSV(text.replace(/^\uFEFF/,'')),H=R[0].map(h=>h.trim().toLowerCase()),ix=n=>H.indexOf(n);
const iD=ix('date'),iC=ix('category'),iDe=ix('debit'),iCr=ix('credit'),iB=ix('balance'),iT=ix('details');
if([iD,iC,iDe,iCr,iB].some(i=>i<0))throw new Error('Kolom wajib tidak lengkap: Date, Category, Debit, Credit, Balance.');
const rows=R.slice(1).map(r=>{const p=(r[iD]||'').trim().split('/');if(p.length<3)return null;let y=+p[2];if(y<100)y+=2000;return{d:y+'-'+String(+p[1]).padStart(2,'0')+'-'+String(+p[0]).padStart(2,'0'),c:(r[iC]||'').trim(),de:num(r[iDe]),cr:num(r[iCr]),b:num(r[iB]),t:iT>=0?(r[iT]||''):''}}).filter(Boolean);
if(!rows.length)throw new Error('Tidak ada baris data dengan tanggal berformat dd/mm/yy.');
let a=0,b=0;rows.forEach((r,i)=>{if(!i)return;const dl=r.b-rows[i-1].b;if(Math.abs(dl-(r.cr-r.de))<1)a++;if(Math.abs(dl-(r.de-r.cr))<1)b++});
const crIn=a>=b,miss=[];
rows.forEach((r,i)=>{if(!i)return;const e=rows[i-1].b+(crIn?r.cr-r.de:r.de-r.cr);if(Math.abs(r.b-e)>=1)miss.push({d:r.d,x:r.b-e})});
const mm={};let adjTot=0;
rows.forEach(r=>{const inn=crIn?r.cr:r.de,out=crIn?r.de:r.cr,k=r.d.slice(0,7),m=mm[k]||(mm[k]={k,rev:0,cap:0,adj:0,exp:{}}),cl=r.c.toLowerCase();
const isAdj=/balanc/i.test(r.t)||/adjust|balanc/.test(cl)||cl=='incoming transfer'||KNOWN_ADJ.some(x=>x[0]==r.d&&x[1]==inn&&cl=='revenue airbnb');
if(isAdj){m.adj+=inn-out;adjTot+=inn-out}
else if(cl=='revenue airbnb')m.rev+=inn-out;
else if(cl=='investment inflow')m.cap+=inn-out;
else if(inn>0&&out==0){m.adj+=inn;adjTot+=inn}
else{const l=LAB[r.c]||r.c.replace(/^opc\s*-\s*/i,'')||'Lain-lain';m.exp[l]=(m.exp[l]||0)+out-inn}});
const last={};rows.forEach(r=>last[r.d]=r.b);
const bal=Object.keys(last).sort().map(d=>[d,last[d]]);
const months=Object.values(mm).sort((x,y)=>x.k<y.k?-1:1);
months.forEach(m=>{m.tot=Object.values(m.exp).reduce((s,v)=>s+v,0)});
return{months,bal,crIn,miss,adjTot,last:bal[bal.length-1][0]}}
/*ENDPURE*/
const MN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const lb=k=>MN[+k.slice(5)-1]+' '+k.slice(2,4);
const fd=d=>(+d.slice(8))+' '+MN[+d.slice(5,7)-1]+' '+d.slice(0,4);
const fmt=n=>(n<0?'-':'')+'Rp '+Math.round(Math.abs(n)).toLocaleString('id-ID');
const sh=n=>{const a=Math.abs(n),s=n<0?'-':'';return a>=1e6?s+(a/1e6).toFixed(1).replace('.',',')+' jt':a>=1e3?s+Math.round(a/1e3)+' rb':s+a};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const $=id=>document.getElementById(id);
let D=null;
Chart.defaults.font.family="'IBM Plex Sans',system-ui,sans-serif";Chart.defaults.color=css('--mut');
const grid={color:css('--line')};
const base=x=>Object.assign({responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}},x);
const c1=new Chart($('c1'),{type:'line',data:{labels:[],datasets:[{data:[],borderColor:css('--in'),backgroundColor:'transparent',pointRadius:0,borderWidth:2,stepped:true}]},options:base({scales:{x:{ticks:{maxTicksLimit:6},grid:{display:false}},y:{ticks:{callback:sh},grid}},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.parsed.y)}}}})});
const c2=new Chart($('c2'),{type:'bar',data:{labels:[],datasets:[{label:'Pendapatan',data:[],backgroundColor:css('--in')},{label:'Pengeluaran',data:[],backgroundColor:css('--out')},{label:'Hasil operasional',type:'line',data:[],borderColor:css('--ink'),backgroundColor:css('--ink'),pointRadius:3,borderWidth:2}]},options:base({scales:{x:{grid:{display:false}},y:{ticks:{callback:sh},grid}},plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:12}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmt(c.parsed.y)}}}})});
const c3=new Chart($('c3'),{type:'bar',data:{labels:[],datasets:[{data:[],backgroundColor:css('--out')}]},options:base({indexAxis:'y',scales:{x:{ticks:{callback:sh},grid},y:{grid:{display:false}}},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.parsed.x)}}}})});
function setup(){const M=D.months;['f','t'].forEach((id,j)=>{$(id).innerHTML=M.map((m,i)=>'<option value="'+i+'">'+lb(m.k)+'</option>').join('');$(id).value=j?M.length-1:0;$(id).onchange=render})}
function render(){
const M=D.months;let a=+$('f').value,b=+$('t').value;if(a>b){[a,b]=[b,a];$('f').value=a;$('t').value=b}
const ms=M.slice(a,b+1),sum=f=>ms.reduce((s,m)=>s+f(m),0),rev=sum(m=>m.rev),exp=sum(m=>m.tot),net=rev-exp,cap=sum(m=>m.cap),isLast=b==M.length-1;
$('sub').textContent='Periode '+lb(M[a].k)+' sampai '+lb(M[b].k)+', data sampai '+fd(D.last)+'. Semua angka dalam rupiah.';
$('k1').textContent=fmt(rev);$('k2').textContent=fmt(exp);$('k3').textContent=fmt(net);$('k4').textContent=fmt(cap);
$('k3s').textContent=rev?'Margin '+(net/rev*100).toFixed(0)+'% dari pendapatan':'';
const s=M[a].k+'-01',e=M[b].k+'-31',pts=D.bal.filter(p=>p[0]>=s&&p[0]<=e);
$('bal').textContent=pts.length?fmt(pts[pts.length-1][1]):'-';
c1.data.labels=pts.map(p=>fd(p[0]).slice(0,-5));c1.data.datasets[0].data=pts.map(p=>p[1]);c1.update();
c2.data.labels=ms.map(m=>lb(m.k)+(m.k==M[M.length-1].k?'*':''));
c2.data.datasets[0].data=ms.map(m=>m.rev);c2.data.datasets[1].data=ms.map(m=>m.tot);c2.data.datasets[2].data=ms.map(m=>m.rev-m.tot);c2.update();
const cat={};ms.forEach(m=>Object.entries(m.exp).forEach(([k,v])=>cat[k]=(cat[k]||0)+v));
const en=Object.entries(cat).sort((x,y)=>y[1]-x[1]);
c3.data.labels=en.map(x=>x[0]);c3.data.datasets[0].data=en.map(x=>x[1]);c3.update();
const mi=D.miss.slice(0,3).map(x=>fd(x.d)+' ('+fmt(x.x)+')').join(', ');
$('note').innerHTML='<p>* Bulan terakhir baru terisi sampai '+fd(D.last)+'. Dibaca sebagai: '+(D.crIn?'Credit = uang masuk, Debit = uang keluar':'Debit = uang masuk, Credit = uang keluar')+'.</p>'
+(D.adjTot?'<p>Penyesuaian saldo dan transfer lain sebesar '+fmt(D.adjTot)+' tidak dihitung sebagai pendapatan.</p>':'')
+(D.miss.length?'<p>Saldo di sheet tidak cocok dengan arus kas pada '+D.miss.length+' baris, antara lain '+mi+'. Angka saldo mengikuti sheet apa adanya.</p>':'');
}
function load(text){try{D=analyze(text);$('err').hidden=true;setup();render()}catch(x){$('err').hidden=false;$('err').textContent='Data tidak bisa dibaca: '+x.message}}
fetch('data.csv?v='+Date.now()).then(r=>{if(!r.ok)throw new Error('data.csv tidak ditemukan di folder yang sama dengan index.html.');return r.text()}).then(load).catch(x=>{$('sub').textContent='';$('err').hidden=false;$('err').textContent=x.message+' Kamu juga bisa memilih file CSV lewat tombol di atas.'});
$('file').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(load)};
</script></body></html>
